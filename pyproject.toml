[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secaudit"
version = "0.1.3"
description = "Run established security scanners against your own repo and local instance; normalise findings into one schema."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30", "bandit>=1.8", "pip-audit>=2.8"]

[project.scripts]
secaudit = "secaudit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["secaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
